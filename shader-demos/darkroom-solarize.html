form sampler2D back,portraitTexture;\nconst float PI=3.14159265359;\nfloat hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\nfloat noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}\nfloat fbm(vec2 p){float n=0.,a=.5;for(int i=0;i<5;i++){n+=a*noise(p);p=mat2(.8,.6,-.6,.8)*p*2.03+1.7;a*=.5;}return n;}\nvec2 centered(){return (v-.5)*vec2(res.x/res.y,1.)*max(1.,.88/(res.x/res.y));}\nfloat grain(vec2 p){return hash(p*res)-.5;}\nfloat leaf(vec2 q,vec2 pos,float angle,float size){q-=pos;q=mat2(cos(angle),-sin(angle),sin(angle),cos(angle))*q;return 1.-smoothstep(.92,1.03,length(q/vec2(size*.32,size)));}\nfloat botanic(vec2 q){float b=0.;for(int i=0;i<8;i++){float f=float(i);vec2 c=vec2(sin(f*2.3)*.27,(f-3.5)*.105);b=max(b,leaf(q,c,f*.9,.17));}b=max(b,1.-smoothstep(.004,.01,abs(q.x-.032*sin(q.y*14.))));return b;}\nfloat portrait(vec2 q){float head=1.-smoothstep(.98,1.02,length((q-vec2(.0,.14))/vec2(.18,.25)));float neck=1.-smoothstep(.065,.075,abs(q.x+.015));neck*=1.-smoothstep(.14,.17,abs(q.y+.06));float shoulder=1.-smoothstep(.96,1.02,length((q-vec2(-.02,-.39))/vec2(.34,.25)));float nose=1.-smoothstep(.96,1.02,length((q-vec2(.15,.14))/vec2(.07,.055)));return max(max(head,nose),max(neck,shoulder));}\nfloat scene(vec2 q){float hills=.5+.13*sin(q.x*4.+.6)+.08*sin(q.x*8.);float land=smoothstep(hills-.015,hills+.015,.5-q.y);float sun=1.-smoothstep(.085,.092,length(q-vec2(.22,.18)));return clamp(.2+.45*land+.35*sun+.1*fbm(q*9.),0.,1.);}\nvec3 ink(vec3 c){return clamp(c+grain(v)*.018,0.,1.);}\n\nfloat portraitLum(vec2 q){vec2 uv=(q-vec2(0.,.035))/vec2(.76,.95)+.5;float edge=min(min(uv.x,1.-uv.x),min(uv.y,1.-uv.y));float mask=smoothstep(0.,.045,edge);float lum=pow(texture2D(portraitTexture,clamp(uv,vec2(.001),vec2(.999))).r,.88);return mix(.90,lum,mask);}\n";
