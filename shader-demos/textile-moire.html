tom:10px}details{top:68px;right:22px;max-width:calc(100% - 44px)}.status{left:22px;top:68px;max-width:170px;font-size:8px}.notes{max-height:55vh;overflow:auto}.hint{font-size:9px}}</style></head><body><canvas aria-label="經緯之間，互動程序化藝術"></canvas><header><a class="back" href="shader-demo-list.html">← 光與物質 / 作品目錄</a><span class="folio">16 / 16</span></header><span class="status" aria-live="polite"></span><details><summary>作品筆記</summary><div class="notes"><p><b>技術原理</b>兩層紗線以不同角度與間距交疊，細小的頻率差形成 moiré。纖維粗細、斷線與磨損由固定種子決定；偏心皺摺改變局部張力，疏薄布緣讓紙白透出。</p><p><b>核心參數</b>織紋角度、皺摺張力。滑桿由左至右增加強度。</p><p><b>適合的位置</b>服裝品牌、工藝作品集、材質背景。</p></div></details><section class="intro"><p class="kicker">WORN GAUZE / A STUDY OF TENSION</p><h1>經緯之間</h1><p class="statement">兩層布稍微錯開，平面就開始有了呼吸。</p></section><div class="controls" aria-label="作品控制"><div class="control"><label for="p0">織紋角度<span class="value">0.50</span></label><input id="p0" data-i="0" type="range" min="0" max="1" step="0.01" value="0.5"></div><div class="control"><label for="p1">皺摺張力<span class="value">0.55</span></label><input id="p1" data-i="1" type="range" min="0" max="1" step="0.01" value="0.55"></div></div><div id="error" role="alert" hidden></div><noscript><div style="position:absolute;top:35%;left:15%;right:15%">請啟用 JavaScript 以觀看這件程序化作品。</div></noscript><script>const CONFIG={"mode":"single","shader":"\nvec2 twist(vec2 q,vec2 center,float strength,float radius){vec2 d=q-center;float angle=strength*exp(-dot(d,d)/(radius*radius));float ca=cos(angle),sa=sin(angle);return center+mat2(ca,-sa,sa,ca)*d;}\nfloat gauze(vec2 p,float freq,float seed){p+=.004*vec2(sin(p.y*8.+seed),sin(p.x*6.-seed));vec2 g=p*freq;float ix=floor(g.x),iy=floor(g.y);float wx=.025+.063*hash(vec2(ix,seed)),wy=.023+.056*hash(vec2(iy,seed+3.));wx*=.45+.8*noise(vec2(p.y*31.,ix));wy*=.45+.8*noise(vec2(p.x*29.,iy));float dx=abs(fract(g.x)-.5+.06*sin(p.y*13.+ix*1.3)),dy=abs(fract(g.y)-.5+.055*sin(p.x*11.+iy*.7));float aa=freq/res.y*.43;float x=1.-smoothstep(wx,wx+aa,dx),y=1.-smoothstep(wy,wy+aa,dy);x*=smoothstep(.075,.13,hash(vec2(ix,floor(p.y*11.)+seed)));y*=smoothstep(.075,.13,hash(vec2(iy,floor(p.x*9.)+seed+8.)));float fiber=max(x,y);float nap=.85+.15*sin(p.x*390.+p.y*211.+seed);return fiber*nap;}\nvoid main(){vec2 q=centered();float tension=.22+p2*.78;float drift=sin(time*.06)*.005;float curve=.12+q.y*.30+.055*sin(q.y*5.);float d=q.x-curve;vec2 w=twist(q,vec2(.16,-.06),tension*.34,.37);w.x+=tension*.035*exp(-d*d/.024);w.y+=tension*.045*sin(q.x*4.+drift)*exp(-d*d/.08);w+=.003*vec2(sin(w.y*9.),sin(w.x*7.));float angle=.06+p1*.16;vec2 r=mat2(cos(angle),-sin(angle),sin(angle),cos(angle))*w;r.x+=tension*.012*sin(r.y*7.+.8);float maskA=1.-smoothstep(.91,1.04,length((q-vec2(-.19,.09))/vec2(.73,.53))+.018*noise(q*37.));float maskB=1.-smoothstep(.91,1.03,length((q-vec2(.24,-.10))/vec2(.53,.67))+.017*noise(q*41.+3.));float a=gauze(w,132.,7.)*maskA,b=gauze(r,145.,19.)*maskB;vec3 bone=vec3(.925,.906,.855),charcoal=vec3(.18,.185,.18),taupe=vec3(.50,.46,.395);vec3 c=bone;c=mix(c,taupe,maskA*.07+maskB*.045);c=mix(c,taupe,a*.54);c=mix(c,charcoal,b*.62);float crease=exp(-d*d/(.0015+.002*(1.-tension)));float shoulder=exp(-pow(d-.05,2.)/.005);c*=1.-crease*tension*.20*maskA*maskB;c=mix(c,bone,shoulder*.07*maskA);float worn=noise(q*23.+4.)*noise(q*61.);c=mix(c,bone,smoothstep(.40,.72,worn)*.12);c+=grain(v)*.032;gl_FragColor=vec4(clamp(c,0.,1.),1);}\n","sim":"","slug":"textile-moire"};const COMMON="\nprecision highp float;\nvarying vec2 v;\nuniform vec2 res,mouse;\nuniform float time,p1,p2,frame,pressed,stepNo;\nuniform sampler2D back;\nconst float PI=3.14159265359;\nfloat hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\nfloat noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}\nfloat fbm(vec2 p){float n=0.,a=.5;for(int i=0;i<5;i++){n+=a*noise(p);p=mat2(.8,.6,-.6,.8)*p*2.03+1.7;a*=.5;}return n;}\nvec2 centered(){return (v-.5)*vec2(res.x/res.y,1.)*max(1.,.88/(res.x/res.y));}\nfloat grain(vec2 p){return hash(p*res)-.5;}\nfloat leaf(vec2 q,vec2 pos,float angle,float size){q-=pos;q=mat2(cos(angle),-sin(angle),sin(angle),cos(angle))*q;return 1.-smoothstep(.92,1.03,length(q/vec2(size*.32,size)));}\nfloat botanic(vec2 q){float b=0.;for(int i=0;i<8;i++){float f=float(i);vec2 c=vec2(sin(f*2.3)*.27,(f-3.5)*.105);b=max(b,leaf(q,c,f*.9,.17));}b=max(b,1.-smoothstep(.004,.01,abs(q.x-.032*sin(q.y*14.))));return b;}\nfloat portrait(vec2 q){float head=1.-smoothstep(.98,1.02,length((q-vec2(.0,.14))/vec2(.18,.25)));float neck=1.-smoothstep(.065,.075,abs(q.x+.015));neck*=1.-smoothstep(.14,.17,abs(q.y+.06));float shoulder=1.-smoothstep(.96,1.02,length((q-vec2(-.02,-.39))/vec2(.34,.25)));float nose=1.-smoothstep(.96,1.02,length((q-vec2(.15,.14))/vec2(.07,.055)));return max(max(head,nose),max(neck,shoulder));}\nfloat scene(vec2 q){float hills=.5+.13*sin(q.x*4.+.6)+.08*sin(q.x*8.);float land=smoothstep(hills-.015,hills+.015,.5-q.y);float sun=1.-smoothstep(.085,.092,length(q-vec2(.22,.18)));return clamp(.2+.45*land+.35*sun+.1*fbm(q*9.),0.,1.);}\nvec3 ink(vec3 c){return clamp(c+grain(v)*.018,0.,1.);}\n";
(()=>{'use strict';
const canvas=document.querySelector('canvas'),error=document.querySelector('#error'),status=document.querySelector('.status');let gl,webgl2=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');let values=[.5,0],pointer=[.5,.5],down=0,clock=0,prev=0,raf=0,frame=0,pass=0,dirty=true,needsReset=true,pendingSeed=false,targets=[],read=0,simSize=[1,1],program,simProgram,buffer,format,label='RGBA8';
const mode=CONFIG.mode;
function fail(msg){error.hidden=false;error.textContent='這件作品需要可用的 WebGL 繪圖環境。'+msg+' 請啟用瀏覽器硬體加速，或使用支援 WebGL 的瀏覽器重新開啟。';canvas.style.display='none';cancelAnimationFrame(raf);}
try{
gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});webgl2=!!gl;if(!gl)gl=canvas.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true});if(!gl){fail('目前無法建立 WebGL。');return;}
const vertex='attribute vec2 pos; varying vec2 v; void main(){v=pos*.5+.5;gl_Position=vec4(pos,0,1);}';
function compile(src,type){if(webgl2){src='#version 300 es\n'+src.replace(/attribute /g,'in ').replace(/varying /g,type===gl.VERTEX_SHADER?'out ':'in ').replace(/texture2D/g,'texture');if(type===gl.FRAGMENT_SHADER)src=src.replace('precision highp float;','precision highp float;\nout vec4 outColor;').replace(/gl_FragColor/g,'outColor');}const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const reason=gl.getShaderInfoLog(s);gl.deleteShader(s);throw new Error('Shader 編譯失敗：'+reason);}return s;}
function make(fragment){const p=gl.createProgram(),vs=compile(vertex,gl.VERTEX_SHADER),fs=compile(COMMON+fragment,gl.FRAGMENT_SHADER);gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('Shader 連結失敗：'+gl.getProgramInfoLog(p));return {p,loc:Object.fromEntries(['res','mouse','time','p1','p2','frame','pressed','stepNo','back'].map(k=>[k,gl.getUniformLocation(p,k)])),pos:gl.getAttribLocation(p,'pos')};}
program=make(CONFIG.shader);if(CONFIG.sim)simProgram=make(CONFIG.sim);
buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
function target(w,h,f){const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,f.internal,w,h,0,gl.RGBA,f.type,null);const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;return {tex,fbo,ok};}
const candidates=[];if(webgl2){if(gl.getExtension('EXT_color_buffer_float')){candidates.push({internal:gl.RGBA16F,type:gl.HALF_FLOAT,name:'RGBA16F'});candidates.push({internal:gl.RGBA32F,type:gl.FLOAT,name:'RGBA32F'});}}else{const hf=gl.getExtension('OES_texture_half_float');const cf=gl.getExtension('EXT_color_buffer_half_float');if(hf&&cf)candidates.push({internal:gl.RGBA,type:hf.HALF_FLOAT_OES,name:'RGBA16F'});const ff=gl.getExtension('OES_texture_float');const cb=gl.getExtension('WEBGL_color_buffer_float');if(ff&&cb)candidates.push({internal:gl.RGBA,type:gl.FLOAT,name:'RGBA32F'});}candidates.push({internal:gl.RGBA,type:gl.UNSIGNED_BYTE,name:'RGBA8'});
format=candidates[candidates.length-1];if(simProgram){for(const f of candidates){const t=target(4,4,f);gl.deleteFramebuffer(t.fbo);gl.deleteTexture(t.tex);if(t.ok){format=f;break;}}label=format.name;}gl.bindFramebuffer(gl.FRAMEBUFFER,null);
function clear(){for(const t of targets){gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);gl.clearColor(mode==='rd'?1:0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);}gl.bindFramebuffer(gl.FRAMEBUFFER,null);read=0;frame=0;pass=0;needsReset=false;}
let scale=1,slow=0,samples=0,avg=16;
function resize(){const mobile=innerWidth<700;const dpr=Math.min(devicePixelRatio||1,2);const factor=(mobile?.66:1)*scale;const w=Math.max(2,Math.round(innerWidth*dpr*factor)),h=Math.max(2,Math.round(innerHeight*dpr*factor));if(canvas.width===w&&canvas.height===h)return;canvas.width=w;canvas.height=h;if(simProgram){for(const t of targets){gl.deleteTexture(t.tex);gl.deleteFramebuffer(t.fbo);}const max=mode==='rd'?320:mode==='growth'?420:mode==='sort'?768:960;const ratio=Math.min(1,max/Math.max(w,h));simSize=[Math.max(2,Math.round(w*ratio)),Math.max(2,Math.round(h*ratio))];targets=[target(...simSize,format),target(...simSize,format)];if(targets.some(t=>!t.ok))throw new Error('無法建立繪圖緩衝。');clear();}dirty=true;}
function draw(p,targetFbo,w,h,texture){gl.bindFramebuffer(gl.FRAMEBUFFER,targetFbo);gl.viewport(0,0,w,h);gl.useProgram(p.p);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(p.pos);gl.vertexAttribPointer(p.pos,2,gl.FLOAT,false,0,0);const u=p.loc;gl.uniform2f(u.res,w,h);gl.uniform2f(u.mouse,...pointer);gl.uniform1f(u.time,clock);gl.uniform1f(u.p1,values[0]);gl.uniform1f(u.p2,values[1]);gl.uniform1f(u.frame,frame);gl.uniform1f(u.pressed,(down||pendingSeed)?1:0);gl.uniform1f(u.stepNo,pass);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture||null);gl.uniform1i(u.back,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function simulate(count){for(let i=0;i<count;i++){let next=1-read;draw(simProgram,targets[next].fbo,...simSize,targets[read].tex);read=next;frame++;pass++;}}
function render(){if(reduced.matches&&CONFIG.slug==='darkroom-solarize')clock=6;if(needsReset&&simProgram)clear();if(simProgram){if(frame===0){if(mode==='rd')simulate(reduced.matches?650:350);else if(mode==='growth')simulate(reduced.matches?190:130);else if(mode==='sort')simulate(65);else {const old=clock;for(let i=0;i<130;i++){clock=old-6.5+i*.05;simulate(1);}clock=old;};}else if(!reduced.matches){if(mode==='rd')simulate(10);else if(mode==='growth'){if(pass%3===0||down||pendingSeed)simulate(1);else pass++;}else if(mode==='sort'){if(pass<129)simulate(4);}else simulate(1);}else if((down||pendingSeed)&&(mode==='rd'||mode==='growth'))simulate(mode==='rd'?60:12);draw(program,null,canvas.width,canvas.height,targets[read].tex);}else draw(program,null,canvas.width,canvas.height,null);dirty=false;pendingSeed=false;}
function loop(ts){raf=0;if(document.hidden)return;if(prev){let delta=Math.min((ts-prev)/1000,.05);if(!reduced.matches)clock+=delta;if(!reduced.matches){avg=avg*.97+(ts-prev)*.03;samples++;if(samples>180&&avg>29&&scale>.5){slow++;if(slow>70){scale=Math.max(.5,scale*.8);resize();slow=0;samples=0;}}}}prev=ts;if(!reduced.matches||dirty)render();if(!reduced.matches||down)raf=requestAnimationFrame(loop);}
function wake(){dirty=true;if(!raf&&!document.hidden)raf=requestAnimationFrame(loop);}
document.querySelectorAll('input').forEach(el=>{const idx=+el.dataset.i;values[idx]=+el.value;el.addEventListener('input',()=>{values[idx]=+el.value;el.parentElement.querySelector('.value').textContent=Number(el.value).toFixed(2);if(mode==='sort')needsReset=true;wake();});});
document.querySelectorAll('button').forEach(el=>el.addEventListener('click',()=>{const kind=el.dataset.kind;if(kind==='button'){values[1]=1-values[1];el.setAttribute('aria-pressed',String(!!values[1]));el.textContent=values[1]?'切換至 Bayer':'切換至網點';}else if(kind==='develop'){clock=0;}else needsReset=true;wake();}));
function move(e){const r=canvas.getBoundingClientRect();pointer=[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height))];wake();}
canvas.style.touchAction='none';canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerdown',e=>{down=1;pendingSeed=true;move(e);canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',()=>{down=0;wake();});canvas.addEventListener('pointercancel',()=>{down=0;});
addEventListener('resize',()=>{resize();wake();});document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;prev=0;if(!document.hidden)wake();});reduced.addEventListener('change',()=>{prev=0;wake();});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('繪圖環境已中斷，請重新整理。');});
resize();status.textContent=reduced.matches?'靜態觀看 · 已減少動態':(mode==='rd'||mode==='growth'?'觸摸畫面，播種生命':mode==='feedback'||CONFIG.slug==='liquid-distortion'?'移動游標或觸摸畫面':'');if(simProgram&&label==='RGBA8')status.textContent+=' · 8-bit 相容模式';canvas.dataset.renderer=webgl2?'WebGL2':'WebGL1';canvas.dataset.buffer=label;wake();
}catch(e){fail(e.message);}
})();
