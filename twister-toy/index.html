<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SEGMENTS, ARC_RADIUS, TUBE_RADIUS, TwistSolver, forward, alignRigid, rotateByQuat } from './solver.js';

const TWIST_PER_PX = 0.012; // rad per CSS pixel of mouse travel
const TOUCH_TWIST_PER_PX = 0.016; // a little livelier under a finger
const ORBIT_PER_PX = 0.008;
const QUARTER = Math.PI / 2;
const DETENT_HYSTERESIS = 0.03;
// Each palette carries its own backgrounds and fabric settings. Colours repeat around
// the ring ('cycle'), or run out and back so a gradient closes without a seam ('mirror').
const PALETTES = [
  { name: 'unicorn', colors: ['#f2a0b6', '#ffc290', '#f3d77c', '#9fd8b4', '#92c6ec', '#b9a1ea'],
    bg: ['#f6f1ea', '#24212b'] },
  { name: 'sea-salt', colors: ['#8fd6dc', '#5fc2b0', '#3f8fb8', '#f3eee2', '#b9dcf0', '#2f7f9e'],
    bg: ['#eef5f4', '#132630'] },
  { name: 'maple', colors: ['#c8553d', '#e08e45', '#f0c27b', '#8a9a5b', '#6b4f3a', '#d9a07a'],
    bg: ['#f4ebe0', '#2a201b'], sheenMix: 0.45 },
  { name: 'neon', colors: ['#ff3d7f', '#ffd23f', '#3df5c8', '#3d8bff', '#b84dff', '#ff7a3d'],
    bg: ['#2a2633', '#0f0d14'], sheenMix: 0.2, sheen: 0.5, glow: 0.25 },
  { name: 'ink', colors: ['#1f2a44', '#2c3a5e', '#3d4f7c', '#52679a', '#6b81b6', '#8a9dcb', '#a8b7dc', '#c6d1ea', '#e2e8f5'],
    order: 'mirror', bg: ['#eef1f7', '#3a4058'], sheenMix: 0.35 },
  { name: 'matcha', colors: ['#8fae7a', '#c9d6a3', '#f2e8cf', '#e7b7a6', '#b07b6e', '#5e6b4a'],
    bg: ['#f3efe4', '#23261f'], sheenMix: 0.45 },
  { name: 'piano', colors: ['#f5f3ee', '#2b2a2e'],
    bg: ['#d8d2c7', '#57534d'], sheenMix: 0.3 },
];
const PALETTE_KEY = 'twister-toy:palette';

const solver = new TwistSolver();
const debugEl = new URLSearchParams(location.search).has('debug') ? document.body.appendChild(document.createElement('div')) : null;
if (debugEl) debugEl.id = 'debug';

// ---------- scene ----------

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9cfe0, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(3, 5, 6);
scene.add(key);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
const ring = new THREE.Group();
scene.add(ring);

class QuarterArc extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const phi = t * QUARTER;
    return target.set(ARC_RADIUS * Math.sin(phi), ARC_RADIUS * (1 - Math.cos(phi)), 0);
  }
}
const geometry = new THREE.TubeGeometry(new QuarterArc(), 48, TUBE_RADIUS, 24, false);
const meshes = [];
for (let i = 0; i < SEGMENTS; i++) {
  const material = new THREE.MeshPhysicalMaterial({
    roughness: 0.8, metalness: 0, envMapIntensity: 0.5, sheenRoughness: 0.4,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.matrixAutoUpdate = false;
  mesh.userData.index = i;
  ring.add(mesh);
  meshes.push(mesh);
}

// ---------- palettes ----------

const WHITE = new THREE.Color('#ffffff');

/** Text colour that reads on a background: dark ink on light, light ink on dark. */
function inkFor(hex) {
  const c = new THREE.Color(hex);
  const luminance = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b; // linear
  return luminance > 0.18 ? '#3a3540' : '#ece6f0';
}

function segmentColor(palette, i) {
  const n = palette.colors.length;
  if (palette.order !== 'mirror') return palette.colors[i % n];
  const k = i % (2 * n);
  return palette.colors[k < n ? k : 2 * n - 1 - k];
}

let paletteIndex = 0;
try {
  const saved = PALETTES.findIndex((p) => p.name === localStorage.getItem(PALETTE_KEY));
  if (saved >= 0) paletteIndex = saved;
} catch {}

function applyPalette(index) {
  const palette = PALETTES[index];
  for (let i = 0; i < SEGMENTS; i++) {
    const m = meshes[i].material;
    m.color.set(segmentColor(palette, i));
    m.sheen = palette.sheen ?? 1;
    m.sheenColor.copy(m.color).lerp(WHITE, palette.sheenMix ?? 0.6);
    m.emissive.copy(m.color).multiplyScalar(palette.glow ?? 0);
  }
  const root = document.documentElement.style;
  root.setProperty('--bg-light', palette.bg[0]);
  root.setProperty('--bg-dark', palette.bg[1]);
  root.setProperty('--ink-light', inkFor(palette.bg[0]));
  root.setProperty('--ink-dark', inkFor(palette.bg[1]));
  syncThemeColor();
}

const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
function syncThemeColor() {
  document.querySelector('meta[name="theme-color"]').content = PALETTES[paletteIndex].bg[darkScheme.matches ? 1 : 0];
}
darkScheme.addEventListener('change', syncThemeColor);
applyPalette(paletteIndex);

document.getElementById('palette').addEventListener('click', () => {
  unlockAudio();
  paletteIndex = (paletteIndex + 1) % PALETTES.length;
  applyPalette(paletteIndex);
  try { localStorage.setItem(PALETTE_KEY, PALETTES[paletteIndex].name); } catch {}
  detent();
});

// ---------- layout: chain frames → displayed matrices ----------
// The chain is anchored at joint 0, so each new pose is rigidly re-aligned onto the
// previous one (by arc midpoints) to keep the ring visually still while it twists.

const fk = { joints: new Float64Array(SEGMENTS * 12), segments: new Float64Array(SEGMENTS * 12), end: new Float64Array(12) };
const MID_U = ARC_RADIUS * Math.SQRT1_2, MID_V = ARC_RADIUS * (1 - Math.SQRT1_2);
const mids = new Float64Array(SEGMENTS * 3);
let shownMids = null;

function layout() {
  const S = forward(solver.angles, fk).segments;
  for (let i = 0; i < SEGMENTS; i++) {
    const o = i * 12;
    for (let k = 0; k < 3; k++) mids[i * 3 + k] = S[o + 9 + k] + MID_U * S[o + k] + MID_V * S[o + 3 + k];
  }
  let fit;
  if (shownMids) {
    fit = alignRigid(mids, shownMids);
  } else {
    let cx = 0, cy = 0, cz = 0;
    for (let i = 0; i < SEGMENTS; i++) { cx += mids[i * 3]; cy += mids[i * 3 + 1]; cz += mids[i * 3 + 2]; }
    fit = { q: [1, 0, 0, 0], t: [-cx / SEGMENTS, -cy / SEGMENTS, -cz / SEGMENTS] };
    shownMids = new Float64Array(SEGMENTS * 3);
  }
  const { q, t } = fit;
  for (let i = 0; i < SEGMENTS; i++) {
    const o = i * 12;
    const c0 = rotateByQuat(q, S[o], S[o + 1], S[o + 2]);
    const c1 = rotateByQuat(q, S[o + 3], S[o + 4], S[o + 5]);
    const c2 = rotateByQuat(q, S[o + 6], S[o + 7], S[o + 8]);
    const p = rotateByQuat(q, S[o + 9], S[o + 10], S[o + 11]);
    p[0] += t[0]; p[1] += t[1]; p[2] += t[2];
    const mesh = meshes[i];
    mesh.matrix.set(
      c0[0], c1[0], c2[0], p[0],
      c0[1], c1[1], c2[1], p[1],
      c0[2], c1[2], c2[2], p[2],
      0, 0, 0, 1);
    mesh.matrixWorldNeedsUpdate = true;
    const m = rotateByQuat(q, mids[i * 3], mids[i * 3 + 1], mids[i * 3 + 2]);
    shownMids[i * 3] = m[0] + t[0]; shownMids[i * 3 + 1] = m[1] + t[1]; shownMids[i * 3 + 2] = m[2] + t[2];
  }
  if (debugEl) debugEl.textContent = `closure ${solver.error.toExponential(2)}`;
}
layout();

// ---------- framing ----------
// The camera looks straight down −z. While nobody is touching the ring it eases toward
// the position that fits the ring's current silhouette, so it fills small phone screens.

const ARC_SAMPLES = Array.from({ length: 7 }, (_, k) => new QuarterArc().getPoint(k / 6));
const FIT_MARGIN = 0.84;
const camTarget = new THREE.Vector3();
const fitPts = new Float64Array(SEGMENTS * ARC_SAMPLES.length * 3);
const tmpP = new THREE.Vector3();

function fitTarget(out) {
  scene.updateMatrixWorld();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, n = 0;
  for (const mesh of meshes) {
    for (const s of ARC_SAMPLES) {
      tmpP.copy(s).applyMatrix4(mesh.matrixWorld);
      fitPts[n++] = tmpP.x; fitPts[n++] = tmpP.y; fitPts[n++] = tmpP.z;
      minX = Math.min(minX, tmpP.x); maxX = Math.max(maxX, tmpP.x);
      minY = Math.min(minY, tmpP.y); maxY = Math.max(maxY, tmpP.y);
    }
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * FIT_MARGIN;
  const tanH = tanV * camera.aspect;
  let d = 0;
  for (let i = 0; i < n; i += 3) {
    const z = fitPts[i + 2];
    d = Math.max(d, z + (Math.abs(fitPts[i] - cx) + TUBE_RADIUS) / tanH, z + (Math.abs(fitPts[i + 1] - cy) + TUBE_RADIUS) / tanV);
  }
  return out.set(cx, cy, d);
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  camera.position.copy(fitTarget(camTarget));
}
window.addEventListener('resize', resize);
resize();

// ---------- interaction ----------
// Every pointer is tracked on its own: each finger on a segment twists that joint, so
// several fingers twist together; the first pointer on empty space orbits the view.

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();
const spin = new THREE.Quaternion();
const AXIS_X = new THREE.Vector3(1, 0, 0), AXIS_Y = new THREE.Vector3(0, 1, 0);
const TOUCH_REACH = 34; // px beyond the tube's edge a finger may land and still grab it
const MOUSE_REACH = 8;

const pointers = new Map(); // pointerId → { mode, joint, grab, x, y, pending, touch }
const detents = new Map(); // held joint → index of the 90° step it last passed

function toScreen(v, out) {
  tmpC.copy(v).project(camera);
  out.x = (tmpC.x + 1) * 0.5 * window.innerWidth;
  out.y = (1 - tmpC.y) * 0.5 * window.innerHeight;
  return out;
}

/** Finds the segment under (x, y): an exact hit first, else the nearest centre line within reach. */
function pick(x, y, touch) {
  ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(meshes, false)[0];
  if (hit) {
    return { joint: hit.object.userData.index, grab: hit.point.clone().applyMatrix4(hit.object.matrixWorld.clone().invert()) };
  }
  let best = null, bestDist = Infinity;
  const a = { x: 0, y: 0 }, b = { x: 0, y: 0 };
  for (const mesh of meshes) {
    for (let k = 0; k < ARC_SAMPLES.length; k++) {
      toScreen(tmpP.copy(ARC_SAMPLES[k]).applyMatrix4(mesh.matrixWorld), b);
      if (k > 0) {
        // distance from the pointer to the screen segment a→b
        const ex = b.x - a.x, ey = b.y - a.y;
        const t = Math.max(0, Math.min(1, ((x - a.x) * ex + (y - a.y) * ey) / (ex * ex + ey * ey || 1)));
        const dist = Math.hypot(a.x + ex * t - x, a.y + ey * t - y);
        if (dist < bestDist) { bestDist = dist; best = { mesh, k: t < 0.5 ? k - 1 : k }; }
      }
      a.x = b.x; a.y = b.y;
    }
  }
  if (!best) return null;
  // the tube's on-screen radius at that point
  const centre = tmpP.copy(ARC_SAMPLES[best.k]).applyMatrix4(best.mesh.matrixWorld);
  const c0 = toScreen(centre, { x: 0, y: 0 });
  const edge = toScreen(tmpA.set(TUBE_RADIUS, 0, 0).applyQuaternion(camera.quaternion).add(centre), { x: 0, y: 0 });
  const tubePx = Math.hypot(edge.x - c0.x, edge.y - c0.y);
  if (bestDist > tubePx + (touch ? TOUCH_REACH : MOUSE_REACH)) return null;
  return { joint: best.mesh.userData.index, grab: ARC_SAMPLES[best.k].clone() };
}

/** Screen-space perpendicular to the held joint's tangent, signed so the surface follows the finger. */
function twistDirection(joint, grabLocal) {
  const m = meshes[joint].matrixWorld;
  const origin = tmpA.setFromMatrixPosition(m);
  const axis = tmpB.setFromMatrixColumn(m, 0).normalize();
  const s0 = toScreen(origin, { x: 0, y: 0 });
  const s1 = toScreen(origin.clone().addScaledVector(axis, 0.5), { x: 0, y: 0 });
  let tx = s1.x - s0.x, ty = s1.y - s0.y;
  const tl = Math.hypot(tx, ty);

  // How the grabbed surface point moves on screen per radian of twist.
  const grab = grabLocal.clone().applyMatrix4(m);
  const vel = axis.clone().cross(grab.clone().sub(origin)).multiplyScalar(0.05).add(grab);
  const g0 = toScreen(grab, { x: 0, y: 0 }), g1 = toScreen(vel, { x: 0, y: 0 });
  const sx = g1.x - g0.x, sy = g1.y - g0.y;

  if (tl < 6) {
    const sl = Math.hypot(sx, sy) || 1;
    return { x: sx / sl, y: sy / sl };
  }
  let px = -ty / tl, py = tx / tl;
  if (px * sx + py * sy < 0) { px = -px; py = -py; }
  return { x: px, y: py };
}

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', (ev) => {
  const touch = ev.pointerType === 'touch';
  showHelp(touch);
  try { canvas.setPointerCapture(ev.pointerId); } catch {}
  scene.updateMatrixWorld();
  const state = { mode: 'idle', x: ev.clientX, y: ev.clientY, pending: 0, touch };
  const target = pick(ev.clientX, ev.clientY, touch);
  if (target) {
    state.mode = 'twist';
    state.joint = target.joint;
    state.grab = target.grab;
    if (!detents.has(target.joint)) detents.set(target.joint, Math.floor(solver.angles[target.joint] / QUARTER));
  } else if (![...pointers.values()].some((p) => p.mode === 'orbit')) {
    state.mode = 'orbit';
  }
  pointers.set(ev.pointerId, state);
});

canvas.addEventListener('pointermove', (ev) => {
  const state = pointers.get(ev.pointerId);
  if (!state) return;
  const dx = ev.clientX - state.x, dy = ev.clientY - state.y;
  state.x = ev.clientX; state.y = ev.clientY;
  if (state.mode === 'twist') {
    scene.updateMatrixWorld();
    const dir = twistDirection(state.joint, state.grab);
    state.pending += (dx * dir.x + dy * dir.y) * (state.touch ? TOUCH_TWIST_PER_PX : TWIST_PER_PX);
  } else if (state.mode === 'orbit') {
    spin.setFromAxisAngle(AXIS_Y, dx * ORBIT_PER_PX);
    ring.quaternion.premultiply(spin);
    spin.setFromAxisAngle(AXIS_X, dy * ORBIT_PER_PX);
    ring.quaternion.premultiply(spin);
  }
});

function endPointer(ev) {
  const state = pointers.get(ev.pointerId);
  if (!state) return;
  pointers.delete(ev.pointerId);
  if (state.mode === 'twist' && ![...pointers.values()].some((p) => p.mode === 'twist' && p.joint === state.joint)) {
    detents.delete(state.joint);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
document.addEventListener('gesturestart', (ev) => ev.preventDefault());

// ---------- help ----------

const HELP = {
  touch: ['按住任一節滑動：扭轉', '多指按住不同節：同時扭轉', '滑動空白處：旋轉視角', '右下按鈕：聲音開關、切換色系'],
  mouse: ['拖曳任一節：扭轉', '拖曳空白處：旋轉視角', '右下按鈕：聲音開關、切換色系'],
};
const helpEl = document.getElementById('help');
let helpTouch = null;
function showHelp(touch) {
  if (touch === helpTouch) return;
  helpTouch = touch;
  helpEl.replaceChildren(...HELP[touch ? 'touch' : 'mouse'].map((line) => {
    const li = document.createElement('li');
    li.textContent = line;
    return li;
  }));
}
showHelp(window.matchMedia('(hover: none) and (pointer: coarse)').matches);

// ---------- feedback ----------

const MUTE_KEY = 'twister-toy:muted';
let audio = null;
let clickNoise = null;
let muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch {}

/**
 * Creates and resumes the AudioContext. Browsers only allow this inside a user
 * activation — and a touch counts only when the finger lifts (pointerup / touchend),
 * not on pointerdown — so it is retried on every gesture until audio is running.
 */
function unlockAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (muted || !Ctx) return Promise.resolve();
  if (!audio) {
    // Let clicks play even with the iPhone ring/silent switch on; the mute button is the off switch.
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    audio = new Ctx();
    const len = Math.floor(audio.sampleRate * 0.03);
    clickNoise = audio.createBuffer(1, len, audio.sampleRate);
    const data = clickNoise.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.12));
    // A silent tick primes the output path on Safari.
    const prime = audio.createBufferSource();
    prime.buffer = audio.createBuffer(1, 1, audio.sampleRate);
    prime.connect(audio.destination);
    prime.start();
  }
  return audio.state === 'running' ? Promise.resolve() : audio.resume().catch(() => {});
}
for (const type of ['pointerdown', 'pointerup', 'touchend', 'keydown']) {
  document.addEventListener(type, unlockAudio, { capture: true, passive: true });
}

const soundButton = document.getElementById('sound');
function syncSoundButton() {
  soundButton.setAttribute('aria-pressed', String(muted));
  soundButton.setAttribute('aria-label', muted ? '開啟聲音' : '靜音');
}
syncSoundButton();
soundButton.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch {}
  syncSoundButton();
  if (muted) audio?.suspend();
  else unlockAudio().then(playClick);
});

/** A short synthesized click: a band-passed noise snap plus a falling blip. */
function playClick() {
  if (muted || !audio || audio.state !== 'running') return;
  const t = audio.currentTime;
  const out = audio.createGain();
  out.gain.value = 0.5;
  out.connect(audio.destination);

  const snap = audio.createBufferSource();
  snap.buffer = clickNoise;
  snap.playbackRate.value = 0.9 + Math.random() * 0.2;
  const band = audio.createBiquadFilter();
  band.type = 'bandpass';
  band.frequency.value = 2600;
  band.Q.value = 2.5;
  snap.connect(band).connect(out);
  snap.start(t);

  const blip = audio.createOscillator();
  blip.type = 'triangle';
  blip.frequency.setValueAtTime(1500, t);
  blip.frequency.exponentialRampToValueAtTime(700, t + 0.025);
  const env = audio.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(0.35, t + 0.002);
  env.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
  blip.connect(env).connect(out);
  blip.start(t);
  blip.stop(t + 0.04);
}

function detent() {
  playClick();
  if (navigator.vibrate) navigator.vibrate(8);
}

/** Fires feedback each time a held joint passes a multiple of 90°. */
function checkDetents() {
  for (const [joint, step] of detents) {
    const a = solver.angles[joint];
    let k = step;
    while (a > (k + 1) * QUARTER + DETENT_HYSTERESIS) { k++; detent(); }
    while (a < k * QUARTER - DETENT_HYSTERESIS) { k--; detent(); }
    detents.set(joint, k);
  }
}

// ---------- loop ----------

if (debugEl) window.twistDebug = { solver, pointers };

const moves = [];
renderer.setAnimationLoop(() => {
  moves.length = 0;
  for (const p of pointers.values()) {
    if (p.mode === 'twist' && p.pending !== 0) {
      moves.push({ joint: p.joint, delta: p.pending });
      p.pending = 0;
    }
  }
  if (moves.length) {
    const res = solver.twist(moves);
    if (res.applied.some((v) => v !== 0)) {
      layout();
      checkDetents();
    }
  }
  if (pointers.size === 0) camera.position.lerp(fitTarget(camTarget), 0.06);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
