<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Scores — 可重用樂譜</title><style>body{font-family:system-ui;background:#f6f1e7;color:#303d36;max-width:640px;margin:8vh auto;padding:24px;line-height:1.8}button,select{font:inherit;padding:12px;margin:4px;max-width:100%}output{display:block;margin-top:20px}a{color:inherit}</style><h1>八首古典樂，帶去你的作品</h1><p>合成演奏，沒有音檔。點擊播放才啟動聲音。</p><select id="track" aria-label="選擇曲目"></select><button id="play">播放</button><button id="pause">暫停</button><button id="stop">回到開頭</button><output id="status" role="status">等待你的邀請。</output><p><a href="canon-timbres.html">試聽：完整卡農・五種新音色 ↗</a></p><p><a href="CREDITS.md">樂譜來源與授權</a> · <a href="README.md">使用說明</a></p><script src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.js"></script><script src="library.js"></script><script src="player.js"></script><script>
const track=document.querySelector('#track'),status=document.querySelector('#status');
for(const [id,score] of Object.entries(SoftScores)){const option=document.createElement('option');option.value=id;option.textContent=score.title;track.append(option);}
let player;
function load(){if(!window.Tone)throw Error('Tone.js 尚未載入，請確認網路後重新整理');if(!player)player=new SoftScoresPlayer(Tone,SoftScores);player.load(track.value,{onNote:n=>{status.textContent=`${SoftScores[n.track].title} · MIDI ${n.midi} · ${n.role}`;}});}
async function play(){try{if(!window.Tone)throw Error('Tone.js 尚未載入，請確認網路後重新整理');await Tone.start();if(!player)load();await player.play();}catch(e){status.textContent=e.message;}}
track.onchange=()=>{try{const resume=player?.playing;status.textContent='已選擇：'+SoftScores[track.value].title;if(player)load();if(resume)play();}catch(e){status.textContent=e.message;}};
document.querySelector('#play').onclick=play;document.querySelector('#pause').onclick=()=>{player?.pause();status.textContent='已暫停';};document.querySelector('#stop').onclick=()=>{player?.stop();status.textContent='已回到開頭';};
document.addEventListener('visibilitychange',()=>{if(document.hidden){player?.pause();status.textContent='離開頁面，聲音休息中';}});addEventListener('pagehide',()=>player?.dispose());
</script></html>
