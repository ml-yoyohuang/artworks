name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      # Keep the existing portfolio and README-based landing page.
      # Run before npm ci so Jekyll never copies node_modules.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orbit/package-lock.json
      - name: Install ORBIT dependencies
        run: npm ci
        working-directory: orbit
      - name: Test and build ORBIT
        run: |
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:production
        working-directory: orbit
      - name: Publish compiled ORBIT at its existing URL
        # Jekyll's Docker action creates root-owned output on the runner.
        run: sudo rsync -a --delete orbit/dist/ _site/orbit/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
