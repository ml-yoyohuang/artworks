<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTERVAL｜純淨色塊對照</title>
<style>body{margin:0;background:#e6e9e3;color:#273844;font:16px/1.6 system-ui}main{max-width:1500px;margin:auto;padding:32px}h1{font-size:28px;font-weight:500}label{display:inline-block;margin:0 24px 20px 0}select{padding:8px;border:1px solid #a8b5b5;background:transparent;color:inherit;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}figure{margin:0}img{width:100%;display:block}figcaption{padding:12px 0}a{color:inherit}@media(max-width:800px){main{padding:20px}.grid{grid-template-columns:1fr}}</style>
<main><p>INTERVAL　／　COLOUR STUDY</p><h1>純淨色塊・柔和明暗</h1><p>同一鏡頭、同一模型與固定動態姿態的實際瀏覽器截圖。C 已套用於本地正式網站。</p>
<label>觀看位置 <select id="station"><option value="0">第二區入口</option><option value="9">懸浮的門</option><option value="12">第二區出口</option></select></label><label>畫面 <select id="device"><option value="desktop">桌機</option><option value="mobile">手機觸控模擬</option></select></label>
<div class="grid"><figure><img id="A" src="../../screenshots/desktop-colour-A-0.png" alt="A 原版著色"><figcaption>A｜已發布原版</figcaption></figure><figure><img id="B" src="../../screenshots/desktop-colour-B-0.png" alt="B 光照與霧整理"><figcaption>B｜整理光色、霧與接觸陰影</figcaption></figure><figure><img id="C" src="../../screenshots/desktop-colour-C-0.png" alt="C 受控色階"><figcaption>C｜在 B 上加入建築專用柔和色階</figcaption></figure></div>
<p>Chromium 151／SwiftShader。桌機1440×900，手機390×844模擬，未使用實體手機。作品預覽維持原色。</p><p><a href="../../">返回美術館 ↗</a></p></main><script>const station=document.getElementById('station'),device=document.getElementById('device');function update(){for(const id of ['A','B','C'])document.getElementById(id).src=`../../screenshots/${device.value}-colour-${id}-${station.value}.png`;}station.addEventListener('change',update);device.addEventListener('change',update);</script></html>
