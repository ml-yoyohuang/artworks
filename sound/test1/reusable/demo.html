<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOUND / 3 可重用樂譜試聽</title><style>body{font-family:Arial,'PingFang TC',sans-serif;max-width:760px;margin:48px auto;padding:0 24px;color:#303831;background:#f4f1e9}h1{font-weight:400;font-size:30px}p{line-height:1.8;color:#626c62}select,button{font:inherit;padding:12px;border:1px solid #b7bcae;background:#fffdf6;color:inherit;border-radius:3px}select{width:100%;margin:12px 0}button{cursor:pointer}label{display:inline-flex;align-items:center;gap:8px;margin:10px 12px 10px 0}.buttons{display:flex;gap:10px;flex-wrap:wrap}input[type=number]{width:66px;padding:8px}progress{width:100%;margin:24px 0 8px;accent-color:#807947}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#e8e7dd;line-height:1.7;font-size:12px}a{color:#586746}</style><h1>讓樂譜走進另一件作品</h1><p>八組展覽原創音源，以及八首古典主題節選／程式改編。這個頁面只使用獨立樂譜與合成音引擎，不載入展覽程式。</p><label for="track">選擇曲目</label><select id="track"></select><div><label>長度（秒）<input id="duration" type="number" min="4" max="3600" value="32"></label><label>移調（半音）<input id="transpose" type="number" min="-36" max="36" value="0"></label><label><input id="loop" type="checkbox">循環</label><label>音量<input id="volume" type="range" min="0" max="1" step=".05" value=".45"></label></div><div class="buttons"><button id="play">播放</button><button id="pause" disabled>暫停</button><button id="stop">停止</button><button id="json">下載本曲 JSON</button></div><progress id="progress" value="0" max="32" aria-label="播放進度"></progress><p id="status" role="status">按播放後才會啟動聲音。</p><pre id="preview"></pre><p><a href="README.md">使用說明</a> · <a href="CREDITS.md">曲目來源與署名</a></p><script type="module">
import {tracks,getScore} from './library.js';import {ScorePlayer} from './player.js';
const $=id=>document.getElementById(id),options=()=>({duration:Number($('duration').value),transpose:Number($('transpose').value),loop:$('loop').checked}),player=new ScorePlayer({onTime(t,s){$('progress').value=t;$('status').textContent=s.name+' · '+t.toFixed(1)+' / '+s.duration+' 秒'},onEnded(){$('pause').disabled=true;$('status').textContent='播放完成。'}});let paused=false;
for(const track of tracks){const o=document.createElement('option');o.value=track.id;o.textContent=track.name;$('track').append(o)}
function preview(){try{const s=getScore($('track').value,options());$('preview').textContent=JSON.stringify({id:s.id,composer:s.composer,duration:s.duration,events:s.events.slice(0,3)},null,2);$('progress').max=s.duration}catch(e){$('status').textContent=e.message}}
$('track').onchange=()=>{player.stop();$('pause').disabled=true;$('duration').value=tracks.find(t=>t.id===$('track').value).duration;$('progress').value=0;preview()};$('duration').onchange=preview;$('transpose').onchange=preview;
$('play').onclick=async()=>{try{await player.play($('track').value,options());paused=false;$('pause').textContent='暫停';$('pause').disabled=false}catch(e){$('status').textContent='無法播放：'+e.message}};
$('pause').onclick=async()=>{if(paused)await player.resume();else await player.pause();paused=!paused;$('pause').textContent=paused?'繼續':'暫停'};
$('stop').onclick=()=>{player.stop();$('pause').disabled=true;$('progress').value=0;$('status').textContent='已停止。'};$('volume').oninput=()=>player.setVolume(Number($('volume').value));
$('json').onclick=()=>{try{const s=getScore($('track').value,options()),url=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=s.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){$('status').textContent=e.message}};
document.addEventListener('visibilitychange',async()=>{if(document.hidden&&player.playing){await player.pause();paused=true;$('pause').textContent='繼續'}});window.addEventListener('pagehide',()=>void player.close());window.reusable={player,getScore,tracks};preview();
</script></html>
