<!doctype html>
<!-- Source for assets/og-image.png. Render at 1200×630 with tools/og.cjs. -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #eeeae2; color: #1b1b19; }
  body { position: relative; font-family: "Avenir Next", "Helvetica Neue", "PingFang TC", sans-serif; }
  .copy { position: absolute; left: 64px; top: 56px; bottom: 52px; width: 470px; display: flex; flex-direction: column; }
  .kicker { font: 500 14px/1 "SF Mono", Menlo, monospace; letter-spacing: .12em; color: #d9482b; }
  h1 { font-family: "Songti TC", "Noto Serif TC", serif; font-weight: 500; font-size: 112px; line-height: 1.05; letter-spacing: .02em; margin-top: 30px; }
  h1 span { display: block; padding-left: .9em; color: #d9482b; }
  .en { font-family: "Songti TC", Georgia, serif; font-style: italic; font-size: 26px; opacity: .72; margin-top: 18px; }
  .foot { margin-top: auto; font-size: 15px; letter-spacing: .06em; line-height: 1.7; opacity: .7; }
  .foot b { font-weight: 600; opacity: 1; }
  .wave { position: absolute; left: 64px; top: 452px; }
  .wave path { fill: none; stroke: #1b1b19; stroke-width: 2.4; stroke-linecap: round; }
  .grid { position: absolute; right: 40px; top: 40px; width: 600px; height: 550px; display: grid; grid-template-columns: 1.15fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 10px; }
  .grid div { background-size: cover; background-position: center; border-radius: 4px; }
  .a { grid-column: 1 / 3; grid-row: 1; }
  .b { grid-column: 3; grid-row: 1 / 3; }
  .c { grid-column: 1; grid-row: 2 / 4; }
  .d { grid-column: 2; grid-row: 2; }
  .e { grid-column: 2 / 4; grid-row: 3; }
</style></head>
<body>
  <div class="copy">

    <h1>接得<span>剛剛好</span></h1>

    <div class="foot"><b>十件關於時間差的視聽生成作品</b><br>接力、等待、差一點、追上，與剛好一起</div>
  </div>
  <svg class="wave" width="420" height="40" viewBox="0 0 420 40">
    <path d="M2 30 Q 34 18 86 30"/><path d="M122 30 Q 154 18 206 30"/><path d="M242 30 Q 274 18 326 30"/><path d="M362 30 Q 382 22 418 30"/>
    <circle cx="224" cy="12" r="7" fill="#d9482b"/>

  <div class="grid">
    <div class="a" style="background-image:url(../assets/previews/05-phrase-bows.webp);background-position:50% 45%"></div>

    <div class="c" style="background-image:url(../assets/previews/02-color-surfers.webp);background-position:62% 50%"></div>

    <div class="e" style="background-image:url(../assets/previews/06-beat-pages.webp)"></div>
  </div>
</body></html>
